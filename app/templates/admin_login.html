<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#764ba2">
<title>Admin Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
html,body{overscroll-behavior:none;}
html{min-height:100%;background:linear-gradient(135deg,#667eea,#764ba2);background-attachment:fixed;}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:transparent;}
.login-container{background:white;padding:40px;width:350px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.2);}
.login-container h2{text-align:center;margin-bottom:25px;color:#333;}
.form-group{margin-bottom:20px;}
label{display:block;margin-bottom:8px;color:#555;font-weight:bold;}
input[type="email"],input[type="password"]{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;outline:none;transition:0.3s;}
input[type="email"]:focus,input[type="password"]:focus{border-color:#667eea;box-shadow:0 0 8px rgba(102,126,234,0.3);}
button[type="submit"]{width:100%;padding:12px;border:none;border-radius:8px;background:#667eea;color:white;font-size:16px;cursor:pointer;transition:0.3s;}
button[type="submit"]:hover{background:#5563d6;}
button[type="submit"]:disabled{background:#aaa;cursor:not-allowed;}
.error{color:#c0392b;font-size:13px;margin-top:10px;text-align:center;display:none;}
</style>
</head>
<body>
<div class="login-container">
  <h2>Admin Login</h2>
  <form id="login-form">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" id="submit-btn">Login</button>
    <div class="error" id="error-msg"></div>
  </form>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });

    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.message || 'Invalid credentials';
      errEl.style.display = 'block';
      return;
    }

    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('refresh_token', data.refresh_token);

    // Verify it's actually an admin before redirecting
    const me = await fetch('/profile/me', {
      headers: { 'Authorization': 'Bearer ' + data.access_token }
    });
    // We rely on the dashboard to reject non-admins — just redirect
    window.location.href = '/dashboard';

  } catch (err) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});
</script>
</body>
</html>
